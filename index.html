<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Seu draft da ranked de Brawl Stars, pelos dados: melhores picks por mapa, time com amigos e histórico.">
<meta name="theme-color" content="#0a1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brawl Picks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Brawl Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, pensado pro celular; barra de abas fixa embaixo; draft em etapas que vão abrindo. */
:root{
  --bg:#eaf0f8; --surface:#ffffff; --surface2:#dfe7f2; --ink:#0e1a31; --muted:#56637c; --line:#c9d4e4;
  --gold:#f5b800; --gold-ink:#7b5900; --on-gold:#1a1300;
  --ally:#1d74d8; --enemy:#d9392f; --good:#16915a;
  --c-dano:#e4572e; --c-tanque:#2e86de; --c-atirador:#8a5cf6; --c-artilharia:#c98a00; --c-assassino:#d6336c; --c-controlador:#0f9d8a; --c-suporte:#4caf50;
  --m-gem:#8b5cf6; --m-ball:#2f80ed; --m-heist:#d97706; --m-bounty:#0ea5a4; --m-zone:#e0457b; --m-ko:#ea580c;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1222; --surface:#121e36; --surface2:#1a2846; --ink:#edf2fb; --muted:#94a2bd; --line:#283a5d;
  --gold:#ffc61a; --gold-ink:#ffd54f; --on-gold:#1a1300;
  --ally:#4d9cff; --enemy:#ff6b5f; --good:#3ccf89; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a1222; --surface:#121e36; --surface2:#1a2846; --ink:#edf2fb; --muted:#94a2bd; --line:#283a5d;
  --gold:#ffc61a; --gold-ink:#ffd54f; --on-gold:#1a1300;
  --ally:#4d9cff; --enemy:#ff6b5f; --good:#3ccf89; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;flex:none}
.badge{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--display);font-size:20px;transform:rotate(-6deg);box-shadow:0 3px 0 var(--gold-ink)}
.sub{color:var(--muted);font-size:13px}
.hello{font-size:13px;color:var(--muted);text-align:right}
.hello b{color:var(--ink)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step{display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);display:grid;place-items:center;font-size:14px;flex:none}
.done .num{background:var(--good);color:#fff}
.edit{margin-left:auto;background:none;border:0;color:var(--gold-ink);font-weight:600;font-size:13px;padding:4px}
.chosen{font-weight:600}
.notice{background:color-mix(in oklab,var(--gold) 18%,var(--surface));border:1px solid color-mix(in oklab,var(--gold) 55%,var(--line));border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);box-shadow:0 3px 0 var(--gold-ink)}
.btn.gold:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-ink)}
.btn.small{padding:7px 12px;font-size:13px}

/* mapas */
.modes{display:flex;flex-direction:column;gap:12px}
.mode-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.micon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.micon svg{width:14px;height:14px}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.map{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.map b{font-weight:600;font-size:14px}
.map span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 16%,var(--surface))}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice.three{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.opt big{font-family:var(--display);font-size:20px;line-height:1}
.opt small{font-size:12px;color:var(--muted);line-height:1.3}
.opt.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 16%,var(--surface))}
.opt.ally big{color:var(--ally)}.opt.enemy big{color:var(--enemy)}

/* ordem de picks */
.order{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ord{flex:1 0 46px;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;border:2px solid transparent;color:#fff}
.ord.a{background:var(--ally)}.ord.e{background:var(--enemy)}
.ord.me{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ord.past{opacity:.95}.ord.fut{opacity:.35}
.ord i{display:block;font-style:normal;font-family:var(--display);font-size:15px;font-weight:400}

/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border-radius:12px;border:2px dashed var(--line);background:var(--surface2);padding:10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.slot.filled{border-style:solid}
.slot.e.filled{border-color:var(--enemy)}.slot.a.filled{border-color:var(--ally)}
.slot .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.slot.e .who{color:var(--enemy)}.slot.a .who{color:var(--ally)}
.slot .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot>div{min-width:0}

/* fichas de brawler */
.tile{--c:var(--muted);width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--ink);background:color-mix(in oklab,var(--c) 26%,var(--surface));border:2px solid var(--c)}
.tile.lg{width:52px;height:52px;font-size:19px;border-radius:14px}
.k-Dano{--c:var(--c-dano)}.k-Tanque{--c:var(--c-tanque)}.k-Atirador{--c:var(--c-atirador)}.k-Artilharia{--c:var(--c-artilharia)}.k-Assassino{--c:var(--c-assassino)}.k-Controlador{--c:var(--c-controlador)}.k-Suporte{--c:var(--c-suporte)}

/* resultados */
.picks{display:flex;flex-direction:column;gap:10px}
.pick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pick.first{border:2px solid var(--gold);background:color-mix(in oklab,var(--gold) 10%,var(--surface))}
.pick .rank{font-family:var(--display);font-size:13px;color:var(--muted)}
.pick .name{font-family:var(--display);font-size:20px;line-height:1.1}
.pick .cls{font-size:12px;color:var(--muted)}
.pick>div{min-width:0}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.g{background:color-mix(in oklab,var(--good) 18%,var(--surface));color:var(--good)}
.chip.r{background:color-mix(in oklab,var(--enemy) 16%,var(--surface));color:var(--enemy)}
.chip.y{background:color-mix(in oklab,var(--gold) 26%,var(--surface));color:var(--gold-ink)}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-size:22px;font-weight:400;display:block;line-height:1}
.score small{font-size:10.5px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px 0 0}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.fr{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 10px 6px 6px;font-weight:600;font-size:14px}
.fr .tile{width:32px;height:32px;font-size:12px;border-radius:9px}
.bufb{border:2px solid transparent}
.bufb.on{border-color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}

/* listas de dados */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tile{width:32px;height:32px;font-size:12px;border-radius:9px}
.row .nm{font-weight:600;flex:1;min-width:0}
.row .val{font-variant-numeric:tabular-nums;font-weight:700}
.val.pos{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
details.mapref{border-top:1px solid var(--line);padding:10px 0}
details.mapref summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.mapref summary::-webkit-details-marker{display:none}
.mline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.mline:last-child{border-bottom:0}
.mline b{font-weight:600}
.mline span{color:var(--muted);text-align:right}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--gold-ink)}

/* conta */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=search]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.bcell{background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;text-align:center;position:relative;min-width:0}
.bcell span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell.on{border-color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}
.bcell.on::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--good);font-weight:800}
.bcell[disabled]{opacity:.3;cursor:not-allowed}
.count{font-family:var(--display);font-size:26px}
.login{display:flex;align-items:center;gap:12px}
.avatar.sm{width:32px;height:32px;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:4px}
.segb{border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--muted)}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.teamcard.on{border:2px solid var(--good)}
.code{font-family:var(--display);font-weight:400;letter-spacing:.08em;color:var(--ink)}
.invite{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:12px;padding:12px}
.sel{user-select:all;-webkit-user-select:all;font-size:13px;word-break:break-all;color:var(--gold-ink)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.frow{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tilebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tilebox b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tilebox b.sm{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tilebox small{font-size:11.5px;color:var(--muted)}
.wbar{width:56px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:none}
.wbar span{display:block;height:100%;background:var(--good);border-radius:99px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--display);font-size:20px;flex:none}
.saved{font-size:12px;color:var(--muted)}

/* dicas */
.tip{display:flex;gap:12px}
.tip .ic{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);flex:none;color:var(--gold-ink)}
.tip p{margin:2px 0 0;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tscroll{overflow-x:auto}
.ladder{display:flex;flex-wrap:wrap;gap:6px}
.ladder span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--surface2)}
.ladder span.hl{background:var(--gold);color:var(--on-gold)}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--gold-ink)}

/* seletor */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in oklab,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:720px;max-height:86vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet-body{overflow-y:auto;min-height:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .pick{animation:rise .28s ease both}
  .pick:nth-child(2){animation-delay:.04s}.pick:nth-child(3){animation-delay:.08s}.pick:nth-child(4){animation-delay:.12s}.pick:nth-child(5){animation-delay:.16s}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
@media (max-width:420px){ h1{font-size:26px} .choice.three .opt small{font-size:11px} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="20" height="30" rx="5" transform="rotate(-12 15 24)" fill="var(--ally)"/><rect x="23" y="9" width="20" height="30" rx="5" transform="rotate(12 33 24)" fill="var(--enemy)"/><path d="M24 12.5l3.4 7 7.6 1.1-5.5 5.3 1.3 7.6L24 29.9l-6.8 3.6 1.3-7.6-5.5-5.3 7.6-1.1z" fill="var(--gold)" stroke="var(--bg)" stroke-width="2" stroke-linejoin="round"/></svg>
      <div><h1>Brawl Picks</h1><div class="sub">Seu draft da ranked, pelos dados</div></div>
    </div>
    <div class="hello" id="hello"></div>
  </header>
  <main id="app" class="stack"></main>
</div>

<div class="tabs"><nav id="tabs" aria-label="Seções"></nav></div>
<div id="sheet" hidden></div>

<script>
/* ======================= DADOS ======================= */
const CLASSES = {
  Dano:["8-Bit","Carl","Chester","Chuck","Clancy","Colette","Colt","Eve","Lola","Lumi","Mina","Moe","Najia","Nita","Pearl","R-T","Rico","Shelly","Spike","Surge","Tara","Vince"],
  Tanque:["Ash","Bibi","Bolt","Bull","Buster","Damian","Darryl","Draco","El Primo","Frank","Hank","Jacky","Meg","Ollie","Rosa","Trunk"],
  Atirador:["Angelo","Bea","Belle","Bonnie","Brock","Janet","Maisie","Mandy","Nani","Pierce","Piper"],
  Artilharia:["Barley","Dynamike","Grom","Juju","Larry & Lawrie","Penny","Sprout","Tick"],
  Assassino:["Alli","Buzz","Cordelius","Crow","Edgar","Fang","Gigi","Kaze","Kenji","Leon","Lily","Melodie","Mico","Mortis","Nori","Sam","Shade","Starr Nova","Stu"],
  Controlador:["Amber","Bo","Charlie","Cosmo","Emz","Finx","Gale","Gene","Griff","Jessie","Lou","Meeple","Mr. P","Otis","Sandy","Sirius","Squeak","Willow","Ziggy"],
  Suporte:["Berry","Byron","Doug","Glowy","Gray","Gus","Jae-Yong","Kit","Max","Pam","Poco","Ruffs","Wendy"]
};
const CLASS_LABEL = {Dano:"Causador de dano",Tanque:"Tanque",Atirador:"Atirador",Artilharia:"Artilharia",Assassino:"Assassino",Controlador:"Controlador",Suporte:"Suporte"};
const CLS = {}; const ALL = [];
for (const [k,list] of Object.entries(CLASSES)) for (const n of list){ CLS[n]=k; ALL.push(n); }
ALL.sort((a,b)=>a.localeCompare(b));
const abbr = n => n.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase().padEnd(2, n[1]?n[1].toUpperCase():"");

const MODES = {
  gem:{nome:"Pique-Gema",cor:"--m-gem"}, ball:{nome:"Fute-Brawl",cor:"--m-ball"}, zone:{nome:"Zona Estratégica",cor:"--m-zone"},
  heist:{nome:"Roubo",cor:"--m-heist"}, bounty:{nome:"Caça-Estrelas",cor:"--m-bounty"}, ko:{nome:"Nocaute",cor:"--m-ko"}
};

/* Balanceamento oficial de 3 nov 2026 (notas da Supercell). Ainda não há taxa de vitória pós-patch,
   então: nerf forte (mexeu em ataque, vida, Super ou trait base) multiplica a pontuação por 0,5;
   nerf leve (só gadget, buffie, hypercharge ou um número pequeno) por 0,8; buff soma 0,8. */
const PATCH = {
  data:"3 nov",
  forte:{Gus:"Máx. de espíritos 10→3, cura e gadget menores",Shade:"Vida 3700→3400, Super dura 4 s",Amber:"Super e gadgets mais fracos",Wendy:"Projétil 20% menor",Max:"Carrega Super mais devagar",Ash:"Super carrega 15% mais devagar",Maisie:"Ataque 1500→1360"},
  leve:{Pierce:"Último tiro 1500→1400",Nori:"Super por peixe 4%→3%",Colette:"Hypercharge carrega menos",Brock:"Hypercharge e buffie mais fracos",Rico:"Gadget e buffie mais fracos"},
  buff:{Hank:"Vida 5500→6000",Shelly:"Ataque e Super mais fortes",Ziggy:"Ataque 950→1050",Draco:"Super 1120→1620",Chuck:"Recarga mais rápida",Darryl:"Super mais forte",Melodie:"Ataque mais forte",Buster:"Carrega Super mais perto do time",Angelo:"Carrega o tiro 10% mais rápido","R-T":"Projétil 15% maior"},
  misto:{Cosmo:"Mais vida, armadilha menor",Damian:"Soco mais forte, pulo mais lento",Surge:"Hypercharge mudou",Squeak:"Mais dano, star power menor",Kit:"Super cai mais rápido"}
};
const patchOf = n => PATCH.forte[n]?["forte",PATCH.forte[n]] : PATCH.leve[n]?["leve",PATCH.leve[n]] : PATCH.buff[n]?["buff",PATCH.buff[n]] : PATCH.misto[n]?["misto",PATCH.misto[n]] : null;
function patchAdjust(n,s,why){
  const p=patchOf(n); if(!p) return s;
  if(p[0]==="forte"){ why.unshift(["r",`Nerfado em ${PATCH.data}`]); return s*0.5; }
  if(p[0]==="leve"){ why.unshift(["r",`Nerf leve em ${PATCH.data}`]); return s*0.8; }
  if(p[0]==="buff"){ why.unshift(["g",`Buffado em ${PATCH.data}`]); return s+0.8; }
  why.push(["",`Mudou em ${PATCH.data}`]); return s;
}
const nerfed = n => !!(PATCH.forte[n]||PATCH.leve[n]);

const modeVal = (list,n) => { const f=list.find(x=>x[0]===n); return f?f[1]:0; };
function baseScore(n, mapObj){
  const md = MODE_DATA[mapObj.m]; const why=[]; let s=0;
  const mp = modeVal(mapObj.t,n);
  if(mp){ s+=mp; const e=mapObj.t.find(x=>x[0]===n); why.push(["g",`${fmt(e[2])}% de vitória no mapa`]); }
  const forte = modeVal(md.fortes,n), facil = modeVal(md.faceis,n);
  const mb = Math.max(forte, facil*0.9);
  if(mb){ s+=mb*0.7; why.push(["g", forte? `Top no ${MODES[mapObj.m].nome}` : `Fácil de ganhar no modo`]); }
  const ti = md.taxa.findIndex(x=>x[0]===n);
  if(ti>=0){ s+=(11-ti)/11*2.5; if(!mb) why.push(["",`${fmt(md.taxa[ti][1])}% de vitória no modo`]); }
  const rk = Math.max(modeVal(RANKED.fortes,n), modeVal(RANKED.faceis,n)*0.9);
  if(rk){ s+=rk*0.3; why.push(["","Forte no ranked"]); }
  if(TIER.S.some(x=>x[0]===n)){ s+=1.5; if(!nerfed(n)) why.push(["y","Tier S"]); }
  else if(TIER.A.includes(n)){ s+=0.8; }
  s=patchAdjust(n,s,why);
  return {s,why};
}
function fmt(x){ return String(x).replace(".",","); }

const ORDER = ["A1","B1","B2","A2","A3","B3"];
const PHASE = {A1:0,B1:1,B2:1,A2:2,A3:2,B3:3};
function mySlot(){ const d=state.draft; if(!d.fp||!d.pos) return null; const t = d.fp==="me"?"A":"B"; return t+d.pos; }
function slotTeam(sl){ const meA = state.draft.fp==="me"; return (sl[0]==="A")===meA ? "a":"e"; }
function visibleSlots(){ const me=mySlot(); if(!me) return []; return ORDER.filter(s=>PHASE[s]<PHASE[me]); }
function partnerSlot(){ const me=mySlot(); if(!me) return null; return ORDER.find(s=>s!==me && PHASE[s]===PHASE[me]) || null; }

function recommend(){
  const d=state.draft; const mapObj=MAPS[d.map]; const vis=visibleSlots();
  const picked = vis.map(s=>d.picks[s]).filter(Boolean);
  const enemies = vis.filter(s=>slotTeam(s)==="e").map(s=>d.picks[s]).filter(Boolean);
  const allies = vis.filter(s=>slotTeam(s)==="a").map(s=>d.picks[s]).filter(Boolean);
  const own = owned(); const useOwned = state.onlyOwned && own.size>0;
  const myBuffies = new Set(state.profile.buffies||[]);
  const ST = stats(); const mkey = mapObj.slug||mapObj.n;
  const out=[];
  for(const n of ALL){
    if(picked.includes(n) || d.hidden.includes(n)) continue;
    let {s,why}=baseScore(n,mapObj); why=why.slice();
    const c=CLS[n];
    for(const e of enemies){ const ec=CLS[e];
      if(BEATS[c].includes(ec)){ s+=1.2; why.push(["g",`Bom contra ${e}`]); }
      else if(BEATS[ec].includes(c)){ s-=1.2; why.push(["r",`${e} costuma vencer`]); } }
    if(myBuffies.has(n)){ s+=0.5; why.push(["g","Você tem o Buffie"]); }
    else if(HAS_BUFFIE.has(n)) why.push(["","Tem Buffie no jogo"]);
    const dup = allies.filter(a=>CLS[a]===c).length;
    if(dup){ s-=0.8*dup; why.push(["r",`Repete classe do time`]); }
    const ps=ST.byB[n];
    if(ps&&ps.g>=3){ const wr=ps.w/ps.g; s+=(wr-.5)*4*Math.min(1,ps.g/10); why.unshift([wr>=.5?"g":"r",`Você: ${Math.round(wr*100)}% em ${ps.g} jogos`]); }
    const pm=ST.byMB[mkey+"|"+n]; if(pm&&pm.g>=2) s+=(pm.w/pm.g-.5)*2;
    out.push({n,s,why,own:own.has(n)});
  }
  out.sort((a,b)=>b.s-a.s);
  const pool = useOwned ? out.filter(x=>x.own) : out;
  return {top:pool.slice(0,5), all:out, useOwned, enemies, allies};
}

function stats(){
  const st={byB:{},byMB:{},byMap:{},byMode:{},g:0,w:0};
  const add=(o,k,v,extra)=>{ if(!o[k]) o[k]=Object.assign({g:0,w:0},extra||{}); o[k].g++; o[k].w+=v; };
  for(const m of state.matches){ const v=m.venceu?1:0; st.g++; st.w+=v;
    add(st.byB,m.brawler,v); add(st.byMB,m.mapa+"|"+m.brawler,v); add(st.byMap,m.mapa,v,{nome:m.mapaNome,modo:m.modo}); add(st.byMode,m.modo,v); }
  return st;
}
function activeTeam(){ if(!fb.user) return null; return fb.teams.find(x=>x.id===state.activeTeam) || (fb.teams.length===1?fb.teams[0]:null); }

const app = document.getElementById("app");
function render(){
  renderTabs(); renderHello();
  const t=state.tab;
  app.innerHTML = t==="draft"?viewDraft() : t==="team"?viewTeam() : t==="hist"?viewHist() : t==="meta"?viewMetaHub() : viewAccount();
}
function renderHello(){

  document.getElementById("hello").innerHTML = state.profile.nick
    ? `Oi, <b>${esc(state.profile.nick)}</b><br>${n} upados`
    : `<span>${n?n+" upados":"Sem conta ainda"}</span>`;
}
function renderTabs(){

  document.getElementById("tabs").innerHTML = items.map(([k,l])=>`<button class="tab" data-act="tab" data-v="${k}" ${state.tab===k?'aria-current="page"':""}>${ICON[k==="account"?"user":k]}<span>${l}</span></button>`).join("");
}

function viewDraft(){
  const d=state.draft; let h="";
  if(!state.profile.owned.length){
    h+=`<div class="notice"><span>Cadastre os brawlers que você tem no nível 11 pra ver só sugestões que você pode jogar.</span><button class="btn small gold" data-act="tab" data-v="account">Criar conta</button></div>`;
  }
  /* 1 mapa */
  if(d.map===null){
    h+=`<section class="panel step"><div class="step-h"><span class="num">1</span><h2>Qual é o mapa?</h2></div>
      <div class="modes">${Object.keys(MODES).map(m=>`<div><div class="mode-h">${micon(m)}<h3>${MODES[m].nome}</h3></div>
      <div class="maps">${MAPS.map((x,i)=>x.m!==m?"":`<button class="map" data-act="map" data-v="${i}"><b>${esc(x.n)}</b><span>${x.t.length?"Top: "+x.t.slice(0,3).map(t=>esc(t[0])).join(", "):"Usa dados do modo"}</span></button>`).join("")}</div></div>`).join("")}</div></section>`;
    return h;
  }
  const mo=MAPS[d.map];
  h+=`<section class="panel step done"><div class="step-h"><span class="num">✓</span>${micon(mo.m)}<div><div class="eyebrow">${MODES[mo.m].nome}</div><div class="chosen">${esc(mo.n)}</div></div><button class="edit" data-act="reset" data-v="map">Trocar</button></div>
    ${mo.t.length?(()=>{const b=mo.t.find(t=>!PATCH.forte[t[0]])||mo.t[0];const skipped=mo.t.filter(t=>PATCH.forte[t[0]]&&t!==b).map(t=>t[0]);
      return `<div class="sub">Ban que os dados indicam aqui: <b style="color:var(--ink)">${esc(b[0])}</b> (${fmt(b[2])}% de vitória no mapa)${skipped.length?`. ${skipped.map(esc).join(" e ")} liderava, mas tomou nerf forte em ${PATCH.data}.`:""}</div>`;})():`<div class="sub">Esse mapa ainda não tem top 3 próprio nos dados. As sugestões usam os números do modo.</div>`}</section>`;
  /* 2 first pick */
  if(!d.fp){
    h+=`<section class="panel step"><div class="step-h"><span class="num">2</span><h2>Quem ficou com o first pick?</h2></div>
      <div class="choice"><button class="opt ally" data-act="fp" data-v="me"><big>Meu time</big><small>A gente escolhe primeiro</small></button>
      <button class="opt enemy" data-act="fp" data-v="enemy"><big>Inimigo</big><small>Eles escolhem primeiro</small></button></div></section>`;
    return h;
  }
  h+=`<section class="panel step done"><div class="step-h"><span class="num">✓</span><div><div class="eyebrow">First pick</div><div class="chosen" style="color:var(${d.fp==="me"?"--ally":"--enemy"})">${d.fp==="me"?"Meu time":"Time inimigo"}</div></div><button class="edit" data-act="reset" data-v="fp">Trocar</button></div></section>`;
  /* 3 posição */
  if(!d.pos){
    const when = p => { const sl=(d.fp==="me"?"A":"B")+p; const idx=ORDER.indexOf(sl)+1; return idx===1?"Escolhe primeiro de todos":idx===6?"Último pick, vê tudo":`Escolhe no ${idx}º pick`; };
    h+=`<section class="panel step"><div class="step-h"><span class="num">3</span><h2>Qual a sua posição no time?</h2></div>
      <div class="choice three">${[1,2,3].map(p=>`<button class="opt" data-act="pos" data-v="${p}"><big>${p}º</big><small>${p===1?"Primeiro da lista":p===2?"Meio":"Último da lista"}</small><small>${when(p)}</small></button>`).join("")}</div></section>`;
    return h;
  }
  const me=mySlot();
  h+=`<section class="panel step done"><div class="step-h"><span class="num">✓</span><div><div class="eyebrow">Sua posição</div><div class="chosen">${d.pos}º da lista · ${ORDER.indexOf(me)+1}º pick da partida</div></div><button class="edit" data-act="reset" data-v="pos">Trocar</button></div>
    <div class="order">${ORDER.map((s,i)=>{const t=slotTeam(s);const cls=s===me?"me":PHASE[s]<PHASE[me]?"past":PHASE[s]===PHASE[me]?"past":"fut";return `<div class="ord ${t} ${cls}"><i>${i+1}</i>${s===me?"Você":t==="a"?"Aliado":"Inimigo"}</div>`;}).join("")}</div></section>`;
  /* 4 picks visíveis */
  const vis=visibleSlots();
  if(vis.length){
    h+=`<section class="panel step"><div class="step-h"><span class="num">4</span><h2>Quem já foi escolhido?</h2></div>
      <div class="sub">Toque pra marcar. Pode pular os que você não souber.</div>
      <div class="slots">${vis.map(s=>{const t=slotTeam(s);const n=d.picks[s];const idx=ORDER.indexOf(s)+1;
        return `<button class="slot ${t} ${n?"filled":""}" data-act="slot" data-v="${s}">${n?tile(n):`<span class="tile" style="border-style:dashed">+</span>`}<div><div class="who">${t==="a"?"Aliado":"Inimigo"} · ${idx}º</div><div class="nm">${n?esc(n):"Escolher"}</div></div></button>`;}).join("")}</div></section>`;
  }
  /* 5 resultado */
  h+=viewResult();
  return h;
}

function viewResult(){
  const d=state.draft; const me=mySlot(); const ph=PHASE[me];
  const r=recommend(); const own=owned();
  const tip = ph===0 ? "Você é o first pick. Os dados mostram o que mais ganha neste mapa; prefira algo difícil de counterar."
    : ph===3 ? "Último pick: você vê os dois times inteiros, então o counter pesa mais."
    : r.enemies.length ? "Já tem pick inimigo na mesa, então as sugestões somam o mapa com a vantagem de classe contra eles." : "Marque os picks acima pra sugestão considerar os counters.";
  let h=`<section class="step"><div class="step-h"><span class="num" style="background:var(--gold);color:var(--on-gold)">★</span><h2>Seus 5 melhores picks</h2></div>
    <div class="sub">${tip}</div>
    <div class="toggle"><button class="sw" role="switch" aria-checked="${state.onlyOwned&&own.size>0}" data-act="owned" ${own.size?"":"disabled"} aria-label="Só brawlers upados"></button><span>${own.size?`Só meus upados (${own.size})`:"Cadastre seus upados na aba Conta"}</span></div>`;
  if(!r.top.length){
    h+=`<div class="panel">Nenhum dos seus upados sobrou pra esse draft. Desligue o filtro acima pra ver todos.</div>`;
  } else {
    const max=Math.max(...r.top.map(x=>x.s),1);
    h+=`<div class="picks">${r.top.map((x,i)=>`<div class="pick ${i===0?"first":""}">${tile(x.n,"lg")}
      <div><div class="rank">${i===0?"Melhor escolha":(i+1)+"ª opção"}</div><div class="name">${esc(x.n)}</div><div class="cls">${CLASS_LABEL[CLS[x.n]]}${x.own?' · <span style="color:var(--good);font-weight:600">upado</span>':""}</div>
      <div class="why">${(x.why.length?x.why:[["","Sem destaque nos dados, entra pelo seu elenco"]]).slice(0,4).map(w=>`<span class="chip ${w[0]}">${esc(w[1])}</span>`).join("")}</div>
      <button class="x" data-act="hide" data-v="${esc(x.n)}">Foi banido ou pego? Tirar</button></div>
      <div class="score"><b>${Math.round(Math.max(0,x.s)/max*100)}</b><small>pontos</small></div></div>`).join("")}</div>`;
  }
  if(d.hidden.length) h+=`<div class="sub">Tirados: ${d.hidden.map(esc).join(", ")} · <button class="x" data-act="unhide">desfazer</button></div>`;
  /* amigos */
  const partner=partnerSlot();
  const laterAllies = ORDER.filter(s=>slotTeam(s)==="a" && s!==me && PHASE[s]>=PHASE[me]).length;
  const team=activeTeam(); const friends = team ? (fb.members[team.id]||[]).filter(m=>m.uid!==fb.user.uid) : [];
  if(laterAllies){
    const first=r.top[0]?.n; const fc=first?CLS[first]:null;
    const aviso = partner&&slotTeam(partner)==="a" ? "Seu parceiro escolhe junto com você, então combinem antes. " : "";
    if(friends.length){
      const used=new Set(first?[first]:[]); const usedC=new Set(fc?[fc]:[]);
      const rows=friends.map(f=>{
        const fo=new Set(f.owned||[]);
        if(!fo.size) return `<div class="frow"><b>${esc(f.nick||"Amigo")}</b><div class="sub">Ainda não marcou os brawlers upados.</div></div>`;
        const cand=r.all.filter(x=>fo.has(x.n)&&!used.has(x.n)).sort((a,b)=>(b.s-(usedC.has(CLS[b.n])?1:0))-(a.s-(usedC.has(CLS[a.n])?1:0))).slice(0,3);
        if(cand[0]){ used.add(cand[0].n); usedC.add(CLS[cand[0].n]); }
        return `<div class="frow"><b>${esc(f.nick||"Amigo")}</b><div class="friends">${cand.map(x=>`<span class="fr">${tile(x.n)}${esc(x.n)}</span>`).join("")||'<span class="sub">Nenhum upado dele sobrou nesse draft.</span>'}</div></div>`;
      }).join("");
      h+=`<div class="panel stack" style="gap:10px"><h3>Pros amigos do ${esc(team.nome)}</h3><div class="sub">${aviso}Só com os brawlers que cada um tem upado, sem repetir classe quando dá.</div>${rows}</div>`;
    } else {
      const fr=r.all.filter(x=>x.n!==first).sort((a,b)=>(b.s-(CLS[b.n]===fc?1:0))-(a.s-(CLS[a.n]===fc?1:0))).slice(0,3);
      h+=`<div class="panel stack" style="gap:10px"><h3>Pra sugerir aos amigos</h3><div class="sub">${aviso}Opções fortes no mapa com classe diferente da sua melhor escolha.${fb.ready?" Crie um time na aba Time pra ver sugestões com os brawlers que seus amigos têm.":""}</div>
        <div class="friends">${fr.map(x=>`<span class="fr">${tile(x.n)}${esc(x.n)}</span>`).join("")}</div></div>`;
    }
  }
  /* registrar resultado */
  const played = d.played || r.top[0]?.n || null;
  const opts=[...new Set([played,...r.top.map(x=>x.n)].filter(Boolean))];
  h+=`<div class="panel stack" style="gap:10px"><h3>Depois da partida</h3><div class="sub">Marque o resultado pra montar seu histórico. Com 3 jogos ou mais num brawler, as sugestões passam a considerar como você vai com ele.</div>
    <div class="eyebrow">Qual brawler você jogou?</div>
    <div class="friends">${opts.map(n=>`<button class="fr bufb ${n===played?"on":""}" data-act="played" data-v="${esc(n)}">${tile(n)}${esc(n)}</button>`).join("")}<button class="fr bufb" data-act="playedother">Outro…</button></div>
    <div class="choice"><button class="opt ally" data-act="res" data-v="v" ${played?"":"disabled"}><big>Ganhei</big></button><button class="opt enemy" data-act="res" data-v="d" ${played?"":"disabled"}><big>Perdi</big></button></div>
    ${d.savedMsg?`<div class="sub" style="color:var(--good);font-weight:600">${esc(d.savedMsg)}</div>`:""}</div>`;
  h+=`<div class="src">A pontuação junta a taxa de vitória no mapa (Brawl Planet, ranqueada Diamante 1 pra cima, ${esc(mapsDate())}), a força no modo e no ranked (Brawl Time Ninja, 1 nov) e o tier por vitória (Brawl Planet). Boa parte desses números ainda é de antes do balanceamento de ${PATCH.data}: nerf forte corta a pontuação pela metade, nerf leve tira 20% e buff soma um pouco, até sair dado novo. O "bom contra" é regra geral de classe, não estatística de confronto.</div>
    <button class="btn" data-act="newdraft">Novo draft</button></section>`;
  return h;
}

  const nerfList=[...Object.entries(PATCH.forte).map(e=>[...e,"forte"]),...Object.entries(PATCH.leve).map(e=>[...e,"leve"])];

function upgradeList(){
  const own=owned(); const res=[];
  for(const n of ALL){
    let s=0, maps=0, modes=[];
    for(const mp of MAPS){ const v=modeVal(mp.t.slice(0,3),n); if(v){ s+=v; maps++; } }
    for(const m of Object.keys(MODES)){ const v=Math.max(modeVal(MODE_DATA[m].fortes,n),modeVal(MODE_DATA[m].faceis,n)*0.9); if(v){ s+=v*0.7; modes.push(MODES[m].nome);} }
    s+=Math.max(modeVal(RANKED.fortes,n),modeVal(RANKED.faceis,n))*0.8;
    if(TIER.S.some(x=>x[0]===n)) s+=3; else if(TIER.A.includes(n)) s+=1.5;
    if(s>0) s=patchAdjust(n,s,[]);
    if(s>0) res.push({n,s,maps,modes,own:own.has(n)});
  }
  return res.sort((a,b)=>b.s-a.s);
}
function viewUp(){

  const mine=L.filter(x=>x.own).slice(0,6);

  return h;
}

    <div class="field"><label for="codein">Código de 6 letras</label><input type="text" id="codein" maxlength="6" placeholder="EX: K7M2QA" value="${esc(state.codeInput)}" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em"></div>
    <button class="btn" data-act="joincode">Entrar</button></div></section>`;

function viewHist(){
  const st=stats(); const pct=(o)=>Math.round(o.w/o.g*100);
  let h=`<section class="stack"><h2>Seu histórico</h2>`;
  if(!st.g){
    return h+`<div class="panel stack" style="gap:8px"><b>Nenhuma partida ainda.</b><div class="sub">No fim do draft tem o quadro "Depois da partida": escolha o brawler que você jogou e toque em Ganhei ou Perdi. Aqui aparece sua taxa de vitória por brawler, modo e mapa.</div><button class="btn gold" data-act="tab" data-v="draft">Ir pro draft</button></div>
      <div class="sub">${fb.user?"Suas partidas ficam salvas na sua conta Google.":"Entre com Google na aba Conta pra salvar as partidas na conta."}</div></section>`;
  }
  const bs=Object.entries(st.byB).sort((a,b)=>b[1].g-a[1].g||b[1].w-a[1].w);
  const best=bs.filter(([,o])=>o.g>=3).sort((a,b)=>pct(b[1])-pct(a[1]))[0];
  const bar=(o)=>`<span class="wbar"><span style="width:${pct(o)}%"></span></span>`;
  h+=`<div class="tiles"><div class="tilebox"><span class="eyebrow">Partidas</span><b>${st.g}</b></div><div class="tilebox"><span class="eyebrow">Vitórias</span><b>${pct(st)}%</b><small>${st.w}V ${st.g-st.w}D</small></div><div class="tilebox"><span class="eyebrow">Seu melhor</span><b class="sm">${best?esc(best[0]):"—"}</b><small>${best?pct(best[1])+"% em "+best[1].g:"3 jogos num brawler"}</small></div></div>`;
  h+=`<div class="panel"><div class="eyebrow">Por brawler</div><div class="rows">${bs.slice(0,15).map(([n,o])=>`<div class="row">${tile(n)}<span class="nm">${esc(n)}<br><span class="sub" style="font-weight:400">${o.w}V ${o.g-o.w}D</span></span>${bar(o)}<span class="val ${pct(o)>=50?"pos":""}">${pct(o)}%</span></div>`).join("")}</div></div>`;
  const ms=Object.entries(st.byMode).sort((a,b)=>b[1].g-a[1].g);
  h+=`<div class="grid2"><div class="panel"><div class="eyebrow">Por modo</div><div class="rows">${ms.map(([m,o])=>`<div class="row">${MODES[m]?micon(m):""}<span class="nm">${MODES[m]?MODES[m].nome:esc(m)}<br><span class="sub" style="font-weight:400">${o.g} partida${o.g>1?"s":""}</span></span>${bar(o)}<span class="val ${pct(o)>=50?"pos":""}">${pct(o)}%</span></div>`).join("")}</div></div>`;
  const mp=Object.entries(st.byMap).sort((a,b)=>b[1].g-a[1].g).slice(0,8);
  h+=`<div class="panel"><div class="eyebrow">Por mapa</div><div class="rows">${mp.map(([k,o])=>`<div class="row"><span class="nm">${esc(o.nome||k)}<br><span class="sub" style="font-weight:400">${o.w}V ${o.g-o.w}D</span></span>${bar(o)}<span class="val ${pct(o)>=50?"pos":""}">${pct(o)}%</span></div>`).join("")}</div></div></div>`;
  h+=`<div class="panel"><div class="eyebrow">Últimas partidas</div><div class="rows">${state.matches.slice(0,20).map(m=>`<div class="row">${tile(m.brawler)}<span class="nm">${esc(m.brawler)} <span class="chip ${m.venceu?"g":"r"}">${m.venceu?"Vitória":"Derrota"}</span><br><span class="sub" style="font-weight:400">${esc(m.mapaNome||m.mapa)} · ${new Date(m.data).toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}</span></span><button class="x" data-act="delm" data-v="${esc(m.id)}">${state.confirm==="m"+m.id?"Apagar?":"Apagar"}</button></div>`).join("")}</div></div>`;
  h+=`<div class="sub">${fb.user?"Salvo na sua conta Google.":"Salvo neste aparelho. Entre com Google na aba Conta pra levar o histórico pra conta."}</div></section>`;
  return h;
}

  saveLocal();

  clearTimeout(timer); timer=setTimeout(flush,700);

async function flush(){
  if(!dbRef) return;

  writing=true; setSync("saving");
  try{ await dbRef.set({nick:state.profile.nick,owned:state.profile.owned,buffies:state.profile.buffies||[],updatedAt:Date.now()}); setSync("cloud"); }
  catch(err){ setSync("local"); if(err&&err.code==="invalid_argument") dbRef=null; }
  writing=false; if(pending){ pending=false; flush(); }
}

async function createTeam(){

async function joinTeam(code){
  if(!fb.user||!code) return;
  if(!/^[A-Z0-9]{6}$/.test(code)) return teamMsg("O código tem 6 letras e números.");
  const F=fb.mods.fs; const ref=F.doc(fb.db,"times",code);
  try{
    const snap=await F.getDoc(ref);
    if(!snap.exists()) return teamMsg("Não achei esse time. Confira o código.");
    const t=snap.data();
    if(t.membros.includes(fb.user.uid)){ state.joinCode=null; clearHash(); return teamMsg("Você já está nesse time."); }
    if(t.membros.length>=3) return teamMsg("Esse time já está cheio.");
    await F.updateDoc(ref,{membros:F.arrayUnion(fb.user.uid)});
    await F.setDoc(F.doc(fb.db,"times",code,"membros",fb.user.uid),memberData());
    state.joinCode=null; state.codeInput=""; state.activeTeam=code; saveTeamLocal(); clearHash();
    teamMsg(`Você entrou no ${t.nome}!`);
  }catch(e){ teamMsg("Não deu pra entrar no time. Tente de novo."); }
}
async function leaveTeam(id){
  const F=fb.mods.fs; const t=fb.teams.find(x=>x.id===id); if(!t) return;
  try{
    if(t.dono===fb.user.uid){
      for(const uid of t.membros){ try{ await F.deleteDoc(F.doc(fb.db,"times",id,"membros",uid)); }catch(e){} }
      await F.deleteDoc(F.doc(fb.db,"times",id));
      teamMsg("Time apagado.");
    } else {
      await F.deleteDoc(F.doc(fb.db,"times",id,"membros",fb.user.uid));
      await F.updateDoc(F.doc(fb.db,"times",id),{membros:F.arrayRemove(fb.user.uid)});
      teamMsg("Você saiu do time.");
    }
    if(state.activeTeam===id){ state.activeTeam=null; saveTeamLocal(); }
  }catch(e){ teamMsg("Não deu pra fazer isso agora. Tente de novo."); }
}

function unsubscribeAll(){ fb.unsubs.forEach(u=>{try{u();}catch(e){}}); fb.unsubs=[]; Object.values(fb.subs).forEach(u=>{try{u();}catch(e){}}); fb.subs={}; fb.teams=[]; fb.members={}; }
function subscribeUser(u){
  const F=fb.mods.fs;
  fb.unsubs.push(F.onSnapshot(F.query(F.collection(fb.db,"times"),F.where("membros","array-contains",u.uid)),snap=>{
    const antes=fb.teams.map(t=>t.id).sort().join();
    fb.teams=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>a.nome.localeCompare(b.nome));
    const ids=new Set(fb.teams.map(t=>t.id));
    for(const id of Object.keys(fb.subs)) if(!ids.has(id)){ fb.subs[id](); delete fb.subs[id]; delete fb.members[id]; }
    for(const id of ids) if(!fb.subs[id]) fb.subs[id]=F.onSnapshot(F.collection(fb.db,"times",id,"membros"),ms=>{ fb.members[id]=ms.docs.map(d=>Object.assign({uid:d.id},d.data())); if(state.tab!=="account") render(); },()=>{});
    if(antes!==fb.teams.map(t=>t.id).sort().join() && fb.teams.length) fbFlush();
    render();
  },()=>{}));
  fb.unsubs.push(F.onSnapshot(F.query(F.collection(fb.db,"usuarios",u.uid,"partidas"),F.orderBy("data","desc"),F.limit(500)),snap=>{
    state.matches=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(m=>CLS[m.brawler]); render();
  },()=>{}));

async function migrateLocalMatches(u){
  const locais=loadLocalMatches(); if(!locais.length) return;
  const F=fb.mods.fs; const col=F.collection(fb.db,"usuarios",u.uid,"partidas");
  try{ for(const m of locais){ const c=Object.assign({},m); delete c.id; await F.addDoc(col,c); } saveLocalMatches([]); }catch(e){}
}
async function loadJoinInfo(){
  if(!fb.ready||!state.joinCode) return;
  fb.joinInfo=undefined;
  try{ const snap=await fb.mods.fs.getDoc(fb.mods.fs.doc(fb.db,"times",state.joinCode)); fb.joinInfo=snap.exists()?snap.data():null; }catch(e){ fb.joinInfo=null; }
  render();
}
function clearHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
function readHash(){ const m=/^#entrar-([A-Za-z0-9]{6})$/.exec(location.hash||""); if(m){ state.joinCode=m[1].toUpperCase(); state.tab="team"; if(fb.user) loadJoinInfo(); render(); } }
window.addEventListener("hashchange",readHash);
readHash();
(async()=>{
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM,authM,fsM]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    fb.mods={auth:authM,fs:fsM}; fb.auth=authM.getAuth(app); fb.db=fsM.getFirestore(app); fb.ready=true;
    authM.getRedirectResult(fb.auth).catch(()=>{});
    authM.onAuthStateChanged(fb.auth, async u=>{
      fb.user=u||null;
      if(u){
        setSync("loading");
        try{
          const snap=await fsM.getDoc(fsM.doc(fb.db,"usuarios",u.uid));
          const primeiro=(u.displayName||"").split(" ")[0];
          if(snap.exists()){ state.profile=cleanProfile(snap.data(),primeiro); saveLocal(); setSync("fb"); }
          else { if(!state.profile.nick) state.profile.nick=primeiro; saveLocal(); await fbFlush(); }
        }catch(e){ setSync("local"); }
        await migrateLocalMatches(u);
        subscribeUser(u);
        if(state.joinCode) loadJoinInfo();
      } else {
        unsubscribeAll(); state.matches=loadLocalMatches();
        if(state.sync==="fb"||state.sync==="loading") setSync("local");
      }
      render();
    });
    render();
  }catch(e){ /* sem Firebase aqui: continua salvando no aparelho */ }
})();

render();
</script>
