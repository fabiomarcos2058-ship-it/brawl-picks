<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Draft Ranked</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, pensado pro celular; barra de abas fixa embaixo; draft em etapas que vão abrindo. */
:root{
  --bg:#eaf0f8; --surface:#ffffff; --surface2:#dfe7f2; --ink:#0e1a31; --muted:#56637c; --line:#c9d4e4;
  --gold:#f5b800; --gold-ink:#7b5900; --on-gold:#1a1300;
  --ally:#1d74d8; --enemy:#d9392f; --good:#16915a;
  --c-dano:#e4572e; --c-tanque:#2e86de; --c-atirador:#8a5cf6; --c-artilharia:#c98a00; --c-assassino:#d6336c; --c-controlador:#0f9d8a; --c-suporte:#4caf50;
  --m-gem:#8b5cf6; --m-ball:#2f80ed; --m-heist:#d97706; --m-bounty:#0ea5a4; --m-zone:#e0457b; --m-ko:#ea580c;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1222; --surface:#121e36; --surface2:#1a2846; --ink:#edf2fb; --muted:#94a2bd; --line:#283a5d;
  --gold:#ffc61a; --gold-ink:#ffd54f; --on-gold:#1a1300;
  --ally:#4d9cff; --enemy:#ff6b5f; --good:#3ccf89; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a1222; --surface:#121e36; --surface2:#1a2846; --ink:#edf2fb; --muted:#94a2bd; --line:#283a5d;
  --gold:#ffc61a; --gold-ink:#ffd54f; --on-gold:#1a1300;
  --ally:#4d9cff; --enemy:#ff6b5f; --good:#3ccf89; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-family:var(--display);font-size:20px;transform:rotate(-6deg);box-shadow:0 3px 0 var(--gold-ink)}
.sub{color:var(--muted);font-size:13px}
.hello{font-size:13px;color:var(--muted);text-align:right}
.hello b{color:var(--ink)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.step{display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);display:grid;place-items:center;font-size:14px;flex:none}
.done .num{background:var(--good);color:#fff}
.edit{margin-left:auto;background:none;border:0;color:var(--gold-ink);font-weight:600;font-size:13px;padding:4px}
.chosen{font-weight:600}
.notice{background:color-mix(in oklab,var(--gold) 18%,var(--surface));border:1px solid color-mix(in oklab,var(--gold) 55%,var(--line));border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);box-shadow:0 3px 0 var(--gold-ink)}
.btn.gold:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-ink)}
.btn.small{padding:7px 12px;font-size:13px}

/* mapas */
.modes{display:flex;flex-direction:column;gap:12px}
.mode-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.micon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.micon svg{width:14px;height:14px}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.map{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.map b{font-weight:600;font-size:14px}
.map span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 16%,var(--surface))}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice.three{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.opt big{font-family:var(--display);font-size:20px;line-height:1}
.opt small{font-size:12px;color:var(--muted);line-height:1.3}
.opt.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 16%,var(--surface))}
.opt.ally big{color:var(--ally)}.opt.enemy big{color:var(--enemy)}

/* ordem de picks */
.order{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ord{flex:1 0 46px;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;border:2px solid transparent;color:#fff}
.ord.a{background:var(--ally)}.ord.e{background:var(--enemy)}
.ord.me{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ord.past{opacity:.95}.ord.fut{opacity:.35}
.ord i{display:block;font-style:normal;font-family:var(--display);font-size:15px;font-weight:400}

/* slots */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border-radius:12px;border:2px dashed var(--line);background:var(--surface2);padding:10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.slot.filled{border-style:solid}
.slot.e.filled{border-color:var(--enemy)}.slot.a.filled{border-color:var(--ally)}
.slot .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.slot.e .who{color:var(--enemy)}.slot.a .who{color:var(--ally)}
.slot .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot>div{min-width:0}

/* fichas de brawler */
.tile{--c:var(--muted);width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--ink);background:color-mix(in oklab,var(--c) 26%,var(--surface));border:2px solid var(--c)}
.tile.lg{width:52px;height:52px;font-size:19px;border-radius:14px}
.k-Dano{--c:var(--c-dano)}.k-Tanque{--c:var(--c-tanque)}.k-Atirador{--c:var(--c-atirador)}.k-Artilharia{--c:var(--c-artilharia)}.k-Assassino{--c:var(--c-assassino)}.k-Controlador{--c:var(--c-controlador)}.k-Suporte{--c:var(--c-suporte)}

/* resultados */
.picks{display:flex;flex-direction:column;gap:10px}
.pick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pick.first{border:2px solid var(--gold);background:color-mix(in oklab,var(--gold) 10%,var(--surface))}
.pick .rank{font-family:var(--display);font-size:13px;color:var(--muted)}
.pick .name{font-family:var(--display);font-size:20px;line-height:1.1}
.pick .cls{font-size:12px;color:var(--muted)}
.pick>div{min-width:0}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.g{background:color-mix(in oklab,var(--good) 18%,var(--surface));color:var(--good)}
.chip.r{background:color-mix(in oklab,var(--enemy) 16%,var(--surface));color:var(--enemy)}
.chip.y{background:color-mix(in oklab,var(--gold) 26%,var(--surface));color:var(--gold-ink)}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-family:var(--display);font-size:22px;font-weight:400;display:block;line-height:1}
.score small{font-size:10.5px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:4px 0 0}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.fr{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 10px 6px 6px;font-weight:600;font-size:14px}
.fr .tile{width:32px;height:32px;font-size:12px;border-radius:9px}
.bufb{border:2px solid transparent}
.bufb.on{border-color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}

/* listas de dados */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tile{width:32px;height:32px;font-size:12px;border-radius:9px}
.row .nm{font-weight:600;flex:1;min-width:0}
.row .val{font-variant-numeric:tabular-nums;font-weight:700}
.val.pos{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
details.mapref{border-top:1px solid var(--line);padding:10px 0}
details.mapref summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.mapref summary::-webkit-details-marker{display:none}
.mline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.mline:last-child{border-bottom:0}
.mline b{font-weight:600}
.mline span{color:var(--muted);text-align:right}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--gold-ink)}

/* conta */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=search]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.bcell{background:var(--surface2);border:2px solid transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;text-align:center;position:relative;min-width:0}
.bcell span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell.on{border-color:var(--good);background:color-mix(in oklab,var(--good) 14%,var(--surface))}
.bcell.on::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--good);font-weight:800}
.bcell[disabled]{opacity:.3;cursor:not-allowed}
.count{font-family:var(--display);font-size:26px}
.saved{font-size:12px;color:var(--muted)}

/* dicas */
.tip{display:flex;gap:12px}
.tip .ic{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);flex:none;color:var(--gold-ink)}
.tip p{margin:2px 0 0;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tscroll{overflow-x:auto}
.ladder{display:flex;flex-wrap:wrap;gap:6px}
.ladder span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--surface2)}
.ladder span.hl{background:var(--gold);color:var(--on-gold)}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--gold-ink)}

/* seletor */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in oklab,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:720px;max-height:86vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet-body{overflow-y:auto;min-height:0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .pick{animation:rise .28s ease both}
  .pick:nth-child(2){animation-delay:.04s}.pick:nth-child(3){animation-delay:.08s}.pick:nth-child(4){animation-delay:.12s}.pick:nth-child(5){animation-delay:.16s}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
@media (max-width:420px){ h1{font-size:26px} .choice.three .opt small{font-size:11px} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="badge" aria-hidden="true">D</div>
      <div><h1>Draft Ranked</h1><div class="sub">Picks pelos dados da temporada · nov 2026</div></div>
    </div>
    <div class="hello" id="hello"></div>
  </header>
  <main id="app" class="stack"></main>
</div>

<div class="tabs"><nav id="tabs" aria-label="Seções"></nav></div>
<div id="sheet" hidden></div>

<script>

const CLS = {}; const ALL = [];
for (const [k,list] of Object.entries(CLASSES)) for (const n of list){ CLS[n]=k; ALL.push(n); }
ALL.sort((a,b)=>a.localeCompare(b));
const abbr = n => n.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase().padEnd(2, n[1]?n[1].toUpperCase():"");

const MODES = {
  gem:{nome:"Pique-Gema",cor:"--m-gem"}, ball:{nome:"Fute-Brawl",cor:"--m-ball"}, zone:{nome:"Zona Estratégica",cor:"--m-zone"},
  heist:{nome:"Roubo",cor:"--m-heist"}, bounty:{nome:"Caça-Estrelas",cor:"--m-bounty"}, ko:{nome:"Nocaute",cor:"--m-ko"}

const MAPS = [

  {"m": "gem", "n": "Mina rochosa", "slug": "hardrockmine_gemgrab", "t": [["Bolt", 8.8, 58.8], ["Shade", 8.3, 58.3], ["Ash", 7.0, 57.0], ["Wendy", 5.9, 55.9], ["Rico", 4.9, 54.9], ["Amber", 4.6, 54.6], ["Rosa", 4.5, 54.5], ["Bo", 4.3, 54.3]]},
  {"m": "gem", "n": "Fliperama rústico", "slug": "rusticarcade_gemgrab", "t": [["Bolt", 16.6, 66.6], ["Clancy", 8.7, 58.7], ["Mr. P", 7.5, 57.5], ["Bo", 7.0, 57.0], ["Jessie", 5.4, 55.4], ["8-Bit", 5.2, 55.2], ["Stu", 4.6, 54.6], ["Pearl", 4.5, 54.5]]},
  {"m": "gem", "n": "Ilumina", "slug": "undermine_gemgrab", "t": [["Bolt", 10.1, 60.1], ["Wendy", 9.9, 59.9], ["Amber", 7.6, 57.6], ["Shade", 6.4, 56.4], ["Ash", 5.1, 55.1], ["Tara", 4.6, 54.6], ["Gus", 4.5, 54.5], ["Bo", 4.0, 54.0]]},

const PATCH = {
  data:"3 nov",
  forte:{Gus:"Máx. de espíritos 10→3, cura e gadget menores",Shade:"Vida 3700→3400, Super dura 4 s",Amber:"Super e gadgets mais fracos",Wendy:"Projétil 20% menor",Max:"Carrega Super mais devagar",Ash:"Super carrega 15% mais devagar",Maisie:"Ataque 1500→1360"},

};
const patchOf = n => PATCH.forte[n]?["forte",PATCH.forte[n]] : PATCH.leve[n]?["leve",PATCH.leve[n]] : PATCH.buff[n]?["buff",PATCH.buff[n]] : PATCH.misto[n]?["misto",PATCH.misto[n]] : null;
function patchAdjust(n,s,why){
  const p=patchOf(n); if(!p) return s;
  if(p[0]==="forte"){ why.unshift(["r",`Nerfado em ${PATCH.data}`]); return s*0.5; }
  if(p[0]==="leve"){ why.unshift(["r",`Nerf leve em ${PATCH.data}`]); return s*0.8; }
  if(p[0]==="buff"){ why.unshift(["g",`Buffado em ${PATCH.data}`]); return s+0.8; }
  why.push(["",`Mudou em ${PATCH.data}`]); return s;
}
const nerfed = n => !!(PATCH.forte[n]||PATCH.leve[n]);

const modeVal = (list,n) => { const f=list.find(x=>x[0]===n); return f?f[1]:0; };
function baseScore(n, mapObj){
  const md = MODE_DATA[mapObj.m]; const why=[]; let s=0;
  const mp = modeVal(mapObj.t,n);
  if(mp){ s+=mp; const e=mapObj.t.find(x=>x[0]===n); why.push(["g",`${fmt(e[2])}% de vitória no mapa`]); }
  const forte = modeVal(md.fortes,n), facil = modeVal(md.faceis,n);
  const mb = Math.max(forte, facil*0.9);
  if(mb){ s+=mb*0.7; why.push(["g", forte? `Top no ${MODES[mapObj.m].nome}` : `Fácil de ganhar no modo`]); }
  const ti = md.taxa.findIndex(x=>x[0]===n);
  if(ti>=0){ s+=(11-ti)/11*2.5; if(!mb) why.push(["",`${fmt(md.taxa[ti][1])}% de vitória no modo`]); }
  const rk = Math.max(modeVal(RANKED.fortes,n), modeVal(RANKED.faceis,n)*0.9);
  if(rk){ s+=rk*0.3; why.push(["","Forte no ranked"]); }
  if(TIER.S.some(x=>x[0]===n)){ s+=1.5; if(!nerfed(n)) why.push(["y","Tier S"]); }
  else if(TIER.A.includes(n)){ s+=0.8; }
  s=patchAdjust(n,s,why);
  return {s,why};
}
function fmt(x){ return String(x).replace(".",","); }

const ORDER = ["A1","B1","B2","A2","A3","B3"];
const PHASE = {A1:0,B1:1,B2:1,A2:2,A3:2,B3:3};
function mySlot(){ const d=state.draft; if(!d.fp||!d.pos) return null; const t = d.fp==="me"?"A":"B"; return t+d.pos; }
function slotTeam(sl){ const meA = state.draft.fp==="me"; return (sl[0]==="A")===meA ? "a":"e"; }
function visibleSlots(){ const me=mySlot(); if(!me) return []; return ORDER.filter(s=>PHASE[s]<PHASE[me]); }
function partnerSlot(){ const me=mySlot(); if(!me) return null; return ORDER.find(s=>s!==me && PHASE[s]===PHASE[me]) || null; }

function recommend(){
  const d=state.draft; const mapObj=MAPS[d.map]; const vis=visibleSlots();
  const picked = vis.map(s=>d.picks[s]).filter(Boolean);
  const enemies = vis.filter(s=>slotTeam(s)==="e").map(s=>d.picks[s]).filter(Boolean);
  const allies = vis.filter(s=>slotTeam(s)==="a").map(s=>d.picks[s]).filter(Boolean);
  const own = owned(); const useOwned = state.onlyOwned && own.size>0;
  const myBuffies = new Set(state.profile.buffies||[]);
  const out=[];
  for(const n of ALL){
    if(picked.includes(n) || d.hidden.includes(n)) continue;
    let {s,why}=baseScore(n,mapObj); why=why.slice();
    const c=CLS[n];
    for(const e of enemies){ const ec=CLS[e];
      if(BEATS[c].includes(ec)){ s+=1.2; why.push(["g",`Bom contra ${e}`]); }
      else if(BEATS[ec].includes(c)){ s-=1.2; why.push(["r",`${e} costuma vencer`]); } }
    if(myBuffies.has(n)){ s+=0.5; why.push(["g","Você tem o Buffie"]); }
    else if(HAS_BUFFIE.has(n)) why.push(["","Tem Buffie no jogo"]);
    const dup = allies.filter(a=>CLS[a]===c).length;
    if(dup){ s-=0.8*dup; why.push(["r",`Repete classe do time`]); }
    out.push({n,s,why,own:own.has(n)});
  }
  out.sort((a,b)=>b.s-a.s);
  const pool = useOwned ? out.filter(x=>x.own) : out;
  return {top:pool.slice(0,5), all:out, useOwned, enemies, allies};
}

function viewResult(){
  const d=state.draft; const me=mySlot(); const ph=PHASE[me];
  const r=recommend(); const own=owned();
  const tip = ph===0 ? "Você é o first pick. Os dados mostram o que mais ganha neste mapa; prefira algo difícil de counterar."
    : ph===3 ? "Último pick: você vê os dois times inteiros, então o counter pesa mais."
    : r.enemies.length ? "Já tem pick inimigo na mesa, então as sugestões somam o mapa com a vantagem de classe contra eles." : "Marque os picks acima pra sugestão considerar os counters.";
  let h=`<section class="step"><div class="step-h"><span class="num" style="background:var(--gold);color:var(--on-gold)">★</span><h2>Seus 5 melhores picks</h2></div>
    <div class="sub">${tip}</div>

  h+=`<div class="src">A pontuação junta a taxa de vitória no mapa (Brawl Planet, ranqueada Diamante 1 pra cima, ${esc(mapsDate())}), a força no modo e no ranked (Brawl Time Ninja, 1 nov) e o tier por vitória (Brawl Planet). Boa parte desses números ainda é de antes do balanceamento de ${PATCH.data}: nerf forte corta a pontuação pela metade, nerf leve tira 20% e buff soma um pouco, até sair dado novo. O "bom contra" é regra geral de classe, não estatística de confronto.</div>

function upgradeList(){
  const own=owned(); const res=[];
  for(const n of ALL){
    let s=0, maps=0, modes=[];
    for(const mp of MAPS){ const v=modeVal(mp.t.slice(0,3),n); if(v){ s+=v; maps++; } }
    for(const m of Object.keys(MODES)){ const v=Math.max(modeVal(MODE_DATA[m].fortes,n),modeVal(MODE_DATA[m].faceis,n)*0.9); if(v){ s+=v*0.7; modes.push(MODES[m].nome);} }
    s+=Math.max(modeVal(RANKED.fortes,n),modeVal(RANKED.faceis,n))*0.8;
    if(TIER.S.some(x=>x[0]===n)) s+=3; else if(TIER.A.includes(n)) s+=1.5;
    if(s>0) s=patchAdjust(n,s,[]);
    if(s>0) res.push({n,s,maps,modes,own:own.has(n)});
  }
  return res.sort((a,b)=>b.s-a.s);
}
function viewUp(){
  const own=owned(); const L=upgradeList(); const todo=L.filter(x=>!x.own).slice(0,10);
  const gaps=Object.keys(MODES).filter(m=>{ const names=[...MODE_DATA[m].fortes,...MODE_DATA[m].faceis].map(x=>x[0]).concat(MAPS.filter(x=>x.m===m).flatMap(x=>x.t.map(t=>t[0]))); return !names.some(n=>own.has(n)); });
  let h=`<section class="stack"><h2>Onde gastar recurso</h2>
    <div class="sub">Ranqueado por quantos mapas do ranked o brawler aparece no top 3, força nos modos e no ranked geral. ${own.size?"Quem você já tem upado fica de fora.":"Cadastre seus upados na Conta pra tirar os que você já tem."}</div>`;
  if(own.size && gaps.length){
    h+=`<div class="notice"><span>Nenhum dos seus upados aparece nos dados de: <b>${gaps.map(g=>MODES[g].nome).join(", ")}</b>. Ter pelo menos um forte em cada modo ajuda mais do que três no mesmo.</span></div>`;
  }
  h+=`<div class="picks">${todo.map((x,i)=>`<div class="pick ${i===0?"first":""}">${tile(x.n,"lg")}<div><div class="rank">${i+1}º pra upar</div><div class="name">${esc(x.n)}</div><div class="cls">${CLASS_LABEL[CLS[x.n]]}</div>

  const mine=L.filter(x=>x.own).slice(0,6);
  if(mine.length) h+=`<div class="panel"><h3>Seus upados que mais rendem agora</h3><div class="rows" style="margin-top:6px">${mine.map(x=>`<div class="row">${tile(x.n)}<span class="nm">${esc(x.n)}</span><span class="val">${x.maps?x.maps+" mapa"+(x.maps>1?"s":""):"modo"}</span></div>`).join("")}</div></div>`;

  return h;
}

function syncLabel(){
  return state.sync==="cloud" ? "Salvo na sua conta Claude, aparece em qualquer aparelho."
    : state.sync==="saving" ? "Salvando…"
    : state.sync==="loading" ? "Carregando sua conta…"
    : "Salvo neste aparelho.";
}

/* ======================= SELETOR DE BRAWLER ======================= */
const sheet=document.getElementById("sheet"); let sheetSlot=null, sheetQ="", sheetF="Todos";
function openSheet(slot){ sheetSlot=slot; sheetQ=""; sheetF="Todos"; drawSheet(); sheet.hidden=false; setTimeout(()=>{const i=document.getElementById("sq"); i&&i.focus();},30); }
function closeSheet(){ sheet.hidden=true; sheetSlot=null; }
function drawSheet(keepFocus){
  const d=state.draft; const taken=new Set(Object.entries(d.picks).filter(([s,n])=>s!==sheetSlot&&n&&visibleSlots().includes(s)).map(([,n])=>n));
  const q=sheetQ.trim().toLowerCase(); const list=ALL.filter(n=>(sheetF==="Todos"||CLS[n]===sheetF)&&(!q||n.toLowerCase().includes(q)));
  const t=slotTeam(sheetSlot);
  const grid=`<div class="bgrid">${list.map(n=>`<button class="bcell" data-act="pickb" data-v="${esc(n)}" ${taken.has(n)?"disabled":""}>${tile(n)}<span>${esc(n)}</span></button>`).join("")||'<div class="sub">Nada encontrado.</div>'}</div>`;
  if(keepFocus){ document.getElementById("sbody").innerHTML=grid; document.querySelectorAll("#sfil .fchip").forEach(b=>b.classList.toggle("on",b.dataset.v===sheetF)); return; }
  sheet.innerHTML=`<div class="sheet" data-act="closebg"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Escolher brawler">
    <div class="sheet-h"><h3 style="color:var(${t==="a"?"--ally":"--enemy"})">${t==="a"?"Pick do aliado":"Pick do inimigo"} · ${ORDER.indexOf(sheetSlot)+1}º</h3>
    <div style="display:flex;gap:6px">${d.picks[sheetSlot]?'<button class="btn small" data-act="clearslot">Limpar</button>':""}<button class="btn small" data-act="close">Fechar</button></div></div>
    <input type="search" id="sq" placeholder="Digite o nome" autocomplete="off">
    <div class="filters" id="sfil">${["Todos",...Object.keys(CLASSES)].map(c=>`<button class="fchip ${sheetF===c?"on":""}" data-act="sf" data-v="${c}">${c==="Todos"?"Todos":CLASS_LABEL[c]}</button>`).join("")}</div>
    <div class="sheet-body" id="sbody">${grid}</div></div></div>`;
}

/* ======================= EVENTOS ======================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v, d=state.draft;
  if(a==="closebg"){ if(e.target===b) closeSheet(); return; }
  switch(a){
    case "tab": state.tab=v; render(); window.scrollTo({top:0}); return;
    case "map": d.map=+v; d.fp=null; d.pos=null; d.picks={}; d.hidden=[]; break;
    case "fp": d.fp=v; d.pos=null; d.picks={}; break;
    case "pos": d.pos=+v; d.picks={}; break;
    case "reset": if(v==="map"){d.map=null;d.fp=null;d.pos=null;} if(v==="fp"){d.fp=null;d.pos=null;} if(v==="pos"){d.pos=null;} d.picks={}; d.hidden=[]; break;
    case "slot": openSheet(v); return;
    case "pickb": d.picks[sheetSlot]=v; closeSheet(); break;
    case "clearslot": delete d.picks[sheetSlot]; closeSheet(); break;
    case "close": closeSheet(); return;
    case "sf": sheetF=v; drawSheet(true); return;
    case "hide": d.hidden.push(v); break;
    case "unhide": d.hidden=[]; break;
    case "owned": state.onlyOwned=!state.onlyOwned; break;
    case "newdraft": state.draft={map:null,fp:null,pos:null,picks:{},hidden:[]}; render(); window.scrollTo({top:0}); return;
    case "accf": state.accFilter=v; break;
    case "buf": { const s=new Set(state.profile.buffies||[]); s.has(v)?s.delete(v):s.add(v); state.profile.buffies=[...s].sort(); persist(); break; }
    case "own": { const s=owned(); s.has(v)?s.delete(v):s.add(v); state.profile.owned=[...s].sort(); persist(); b.classList.toggle("on"); b.setAttribute("aria-pressed",s.has(v)); refreshCount(); return; }
    case "selall": case "selnone": { const f=state.accFilter,q=state.accQuery.trim().toLowerCase(); const list=ALL.filter(n=>(f==="Todos"||CLS[n]===f)&&(!q||n.toLowerCase().includes(q))); const s=owned(); list.forEach(n=>a==="selall"?s.add(n):s.delete(n)); state.profile.owned=[...s].sort(); persist(); break; }
    default: return;
  }
  render();
});
function refreshCount(){ const c=document.querySelector(".count"); if(c) c.textContent=state.profile.owned.length; renderHello(); }
document.addEventListener("input",e=>{
  if(e.target.id==="sq"){ sheetQ=e.target.value; drawSheet(true); }
  if(e.target.id==="accq"){ state.accQuery=e.target.value; const g=document.getElementById("accgrid"); const own=owned(); const f=state.accFilter,q=state.accQuery.trim().toLowerCase();
    const list=ALL.filter(n=>(f==="Todos"||CLS[n]===f)&&(!q||n.toLowerCase().includes(q)));
    g.innerHTML=list.map(n=>`<button class="bcell ${own.has(n)?"on":""}" data-act="own" data-v="${esc(n)}" aria-pressed="${own.has(n)}">${tile(n)}<span>${esc(n)}</span></button>`).join("")||'<div class="sub">Nenhum brawler com esse nome.</div>';
    const sb=document.querySelector('[data-act="selall"]'); if(sb) sb.textContent=`Marcar estes ${list.length}`; }
  if(e.target.id==="nick"){ state.profile.nick=e.target.value.slice(0,24); renderHello(); persist(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sheet.hidden) closeSheet(); });

/* ======================= CONTA NA NUVEM ======================= */
let dbRef=null, writing=false, pending=false, timer=null;
function persist(){
  saveLocal();
  if(!dbRef) return;
  clearTimeout(timer); timer=setTimeout(flush,700);
}
async function flush(){
  if(!dbRef) return;
  if(writing){ pending=true; return; }
  writing=true; setSync("saving");
  try{ await dbRef.set({nick:state.profile.nick,owned:state.profile.owned,buffies:state.profile.buffies||[],updatedAt:Date.now()}); setSync("cloud"); }
  catch(err){ setSync("local"); if(err&&err.code==="invalid_argument") dbRef=null; }
  writing=false; if(pending){ pending=false; flush(); }
}
function setSync(s){ state.sync=s; const el=document.getElementById("saved"); if(el) el.textContent=syncLabel(); }
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    try{ const nm=await user.name(); if(nm&&!state.profile.nick){ state.profile.nick=nm.split(" ")[0]; } }catch(e){}
    dbRef=db.doc("data/users/"+uid+"/profile");
    setSync("loading");
    const snap=await dbRef.get();
    if(snap.exists){ const p=snap.data()||{}; state.profile=cleanProfile(p,state.profile.nick); saveLocal(); setSync("cloud"); render(); }
    else if(state.profile.owned.length||state.profile.nick){ render(); flush(); }
    else { setSync("cloud"); render(); }
  }catch(e){ setSync("local"); }
})();

/* ======================= MAPAS ATUALIZADOS ======================= */
/* No site do GitHub, o bot atualiza data/mapas.json todo dia; aqui o site lê esse arquivo.
   Se não achar (como dentro do Claude), usa os mapas que já vêm no código. */
function mapsDate(){ const d=new Date(MAPS_INFO.atualizado); return isNaN(d)?MAPS_INFO.atualizado:d.toLocaleDateString("pt-BR",{day:"numeric",month:"short",year:"numeric"}); }
function fromJson(j){ return j.mapas.filter(m=>MODES[m.modo]).map(m=>({m:m.modo,n:m.nome,slug:m.slug,t:(m.top||[]).filter(x=>CLS[x[0]]).map(x=>[x[0],Math.round((x[1]-50)*10)/10,x[1]])})); }
(async()=>{
  try{
    const r=await fetch("data/mapas.json",{cache:"no-store"}); if(!r.ok) return;
    const j=await r.json(); if(!j||!Array.isArray(j.mapas)||j.mapas.length<18) return;
    const cur = state.draft.map!==null ? MAPS[state.draft.map].slug : null;
    MAPS.splice(0,MAPS.length,...fromJson(j));
    MAPS_INFO.atualizado=j.atualizado||MAPS_INFO.atualizado;
    if(cur){ const i=MAPS.findIndex(x=>x.slug===cur); state.draft.map = i>=0?i:null; if(i<0){state.draft.fp=null;state.draft.pos=null;state.draft.picks={};} }
    render();
  }catch(e){}
})();

render();
