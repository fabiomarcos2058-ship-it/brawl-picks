name: Vigia do Brawl Stars

on:
  schedule:
    - cron: "17 13 * * *"   # todo dia, 10h17 no horário de Brasília
  workflow_dispatch:         # botão "Run workflow" pra rodar na hora

permissions:
  contents: write
  issues: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procurar posts novos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot/vigia.py
      - name: Salvar posts vistos
        run: |
          git config user.name "vigia-brawl"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vistos.json
          git diff --cached --quiet || git commit -m "Atualiza posts vistos"
          git push
