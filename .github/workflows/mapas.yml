name: Mapas da ranked

on:
  schedule:
    - cron: "47 13 * * *"   # todo dia, 10h47 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  mapas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar mapas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot/mapas.py
      - name: Salvar
        run: |
          git config user.name "vigia-brawl"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mapas.json
          git diff --cached --quiet || git commit -m "Atualiza mapas da ranked"
          git pull --rebase
          git push
